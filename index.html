<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spfpt</title>
<meta name="description" content="Long-form writing on engineering practice, LLM finetuning research, and building with AI agents.">
<meta property="og:title" content="spfpt">
<meta property="og:description" content="Long-form writing on engineering practice, LLM finetuning research, and building with AI agents.">

<meta property="og:url" content="https://spfpt.github.io/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root {
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, monospace;

  --bg: #FAFAF7;
  --bg-soft: #F3F2EE;
  --ink: #18181B;
  --ink-soft: #52525B;
  --ink-mute: #A1A1AA;
  --accent: #5D7290;
  --rule: #E4E4DF;
  --rule-strong: #D4D3CD;
  --selection: #D9E0EB;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19191D;
    --bg-soft: #202126;
    --ink: #ECECEF;
    --ink-soft: #B6B6BE;
    --ink-mute: #85858F;
    --accent: #8FA3C2;
    --rule: #303137;
    --rule-strong: #454752;
    --selection: #334052;
  }
}

[data-theme="dark"] {
  --bg: #19191D;
  --bg-soft: #202126;
  --ink: #ECECEF;
  --ink-soft: #B6B6BE;
  --ink-mute: #85858F;
  --accent: #8FA3C2;
  --rule: #303137;
  --rule-strong: #454752;
  --selection: #334052;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background-color 200ms ease, color 200ms ease;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
::selection { background: var(--selection); color: var(--ink); }

.topbar {
  max-width: 63rem;
  margin: 0 auto;
  width: 100%;
  padding: 1.2rem 1.5rem 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand {
  font-family: var(--font-sans);
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: -0.02em;
}
.brand-mark {
  width: 14px;
  height: 14px;
  display: block;
}
.brand-word {
  line-height: 1;
}
.iconbtn {
  background: transparent;
  border: 0;
  width: 30px;
  height: 30px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink-mute);
  transition: color 150ms ease;
}
.iconbtn:hover { color: var(--ink); }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.iconbtn svg { width: 16px; height: 16px; }
.theme-toggle .sun { display: none; }
.theme-toggle .moon { display: block; }
[data-theme="dark"] .theme-toggle .sun { display: block; }
[data-theme="dark"] .theme-toggle .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .sun { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .moon { display: none; }
}

main {
  max-width: 63rem;
  margin: 0 auto;
  width: 100%;
  padding: 3.25rem 1.5rem 3.5rem;
  flex: 1 0 auto;
}

.intro h1 {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: clamp(1.7rem, 4vw, 2.2rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 0.85rem 0;
  color: var(--ink);
}
.intro p {
  font-size: 1rem;
  color: var(--ink-soft);
  line-height: 1.55;
  max-width: 44rem;
  margin: 0 0 0.62rem 0;
}
.intro p a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: var(--rule-strong);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: text-decoration-color 150ms, color 150ms;
}
.intro p a:hover { color: var(--ink); text-decoration-color: var(--accent); }

.section-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin: 3.25rem 0 0.95rem 0;
  font-weight: 500;
}

.posts {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--rule);
}
.posts li { margin: 0; }
.post {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  text-decoration: none;
  color: inherit;
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--rule);
  transition: color 150ms ease;
}
.post:hover {
  color: var(--accent);
}
.post-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.38rem;
  order: 2;
  flex: 0 0 auto;
  font-size: 0.82rem;
  line-height: 1.4;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink-mute);
  margin: 0 0 0.42rem 0;
}
.post-meta span { display: inline-flex; align-items: center; }
.post-meta span + span::before {
  content: "/";
  color: var(--rule-strong);
  margin-right: 0.38rem;
}
.post-meta .accent {
  color: var(--accent);
  font-weight: 500;
}
.post h2 {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 1.08rem;
  letter-spacing: -0.01em;
  line-height: 1.3;
  margin: 0;
  color: var(--ink);
  transition: color 150ms ease;
}
.post:hover h2 { color: var(--accent); }
.post code {
  font-family: var(--font-mono);
  font-size: 0.84em;
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 0.04em 0.3em;
  border-radius: 3px;
  color: var(--ink-soft);
}
.post:hover code { background: var(--bg); }

.colophon {
  max-width: 63rem;
  margin: 0 auto;
  width: 100%;
  padding: 2.2rem 1.5rem 3rem;
  border-top: 1px solid var(--rule);
  color: var(--ink-mute);
  font-size: 0.84rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  flex-shrink: 0;
}
.colophon a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--rule); transition: color 150ms, border-color 150ms; }
.colophon a:hover { color: var(--accent); border-color: var(--accent); }

@media (max-width: 560px) {
  main { padding: 2.8rem 1.25rem 3rem; }
  .topbar { padding: 1.1rem 1.25rem 0; }
  .colophon { padding: 2rem 1.25rem 3rem; }
  .post {
    display: block;
  }
  .post-meta { margin: 0.3rem 0 0 0; }
  body { font-size: 15.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <a href="./" class="brand"><img class="brand-mark" src="./favicon.svg" alt="" aria-hidden="true"><span class="brand-word">spfpt</span></a>
  <button class="iconbtn theme-toggle" aria-label="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>

<main>
  <section class="intro">
    <h1>spfpt</h1>
    <p>Notes on engineering practice, LLM finetuning research, and building with AI agents.</p>
    <p><a href="https://github.com/sumitdotml">GitHub</a>・<a href="https://linkedin.com/in/sumit-pokharel"> LinkedIn</a></p>
  </section>

  <p class="section-label">Writing</p>
  <ul class="posts">
    <li>
      <a class="post" href="./claude-code-from-zero-to-agentic/">
        <h2>Claude Code, from zero to agentic</h2>
        <p class="post-meta"><span class="accent">Essay</span><span>May 2026</span><span>35 min</span></p>
      </a>
    </li>
  </ul>
</main>

<footer class="colophon">
  <span>spfpt · <span class="year"></span></span>
</footer>

<script>
(function() {
  const KEY = 'spfpt-theme';
  const root = document.documentElement;
  const stored = localStorage.getItem(KEY);
  if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored);
  document.querySelectorAll('.year').forEach(el => { el.textContent = new Date().getFullYear(); });
  document.querySelector('.theme-toggle').addEventListener('click', function() {
    const current = root.getAttribute('data-theme');
    let next;
    if (current === 'dark') next = 'light';
    else if (current === 'light') next = 'dark';
    else next = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(KEY, next);
  });
})();
</script>
</body>
</html>
